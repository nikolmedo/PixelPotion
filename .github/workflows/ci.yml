name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest -q

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # shellcheck is preinstalled on GitHub's Ubuntu runners.
      - name: Lint install, update and uninstall scripts
        run: shellcheck -S warning install.sh update.sh uninstall.sh
      # Same check install.sh runs before enabling the whitelist on the Pi.
      - name: Validate sudoers whitelist syntax
        run: |
          sudo install -m 0440 -o root -g root config/pixelpotion.sudoers /tmp/pixelpotion.sudoers
          sudo visudo -cf /tmp/pixelpotion.sudoers
